name: build
# Verify-only: main is pull-request-only, so this job cannot push. It rebuilds and fails loudly if
# README/dist/badges are stale; the VPS publishes generated files via scripts/publish-build.js (PR).
on:
  push:
    branches: [main]
    paths: ["sellers/**", "state/**", "partners/**", "scripts/**"]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/build.js
      - name: generated files must be current
        run: |
          git diff --exit-code -- README.md dist badges && echo "dist/README/badges are current" || {
            echo "::error::README/dist/badges are out of date. On the VPS run: node scripts/publish-build.js (opens the build PR)."; exit 1; }
