name: build
# Safety net after a merged PR: regenerate README tables, dist/verified.json and badges.
# VPS scripts already run build.js before they push, so this usually finds nothing to commit.
on:
  push:
    branches: [main]
    paths: ["sellers/**", "state/**", "partners/**", "scripts/**"]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/build.js
      - name: commit generated files
        run: |
          git config user.name "x402-verified-bot"
          git config user.email "hello@forgemesh.io"
          git add README.md dist badges
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Build: regenerate feed, badges, README"
          git push
