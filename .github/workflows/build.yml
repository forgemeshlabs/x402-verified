name: build
# Source validation on merge. The VPS publisher generates and automatically merges
# derived files, then syncs the site; contributors never need a second review.
on:
  push:
    branches: [main]
    paths: ["sellers/**", "state/**", "partners/**", "scripts/**", ".github/workflows/build.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/build.js
      - name: publication status
        run: echo "The VPS publisher records initial probes, publishes generated files, and syncs the website within five minutes. See the automated publication PR for the generated commit." >> "$GITHUB_STEP_SUMMARY"
