name: validate
# Fork-safe: runs on pull_request with a read-only token and NO secrets. Results go to the job
# summary (PR comments are not writable from fork PRs).
on:
  pull_request:
    paths: ["sellers/**", "partners/**", "schema/**", "scripts/**", "package.json", "package-lock.json"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/validate.js --base origin/${{ github.base_ref }}
